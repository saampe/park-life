name: Publish Park Life

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - scripts/**
      - tests/**
      - checksums/**
      - package.json
      - PUBLISHING.md
  workflow_dispatch:
    inputs:
      deployment_source:
        description: Source to publish (legacy ZIP remains available until source publishing is verified)
        type: choice
        default: repository
        options:
          - repository
          - legacy-archive

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: inputs.deployment_source != 'legacy-archive'
        with:
          node-version: '22'
      - name: Validate and stage repository source
        if: inputs.deployment_source != 'legacy-archive'
        run: npm run check
      - name: Download original approved Park Life package (retained fallback)
        if: inputs.deployment_source == 'legacy-archive'
        run: |
          python -m pip install --disable-pip-version-check 'gdown==5.2.0'
          gdown --id 1TovlCKLijZWTPn5gfF2dtoU0xQySYcGP -O park-life.zip
          printf '%s  %s\n' '855d8dcdcc03ae2684a618d52f82d166ecd7a95c9bb33d78257ede52bcccce57' 'park-life.zip' | sha256sum --check --strict
          unzip -t park-life.zip
      - name: Extract unchanged game from fallback
        if: inputs.deployment_source == 'legacy-archive'
        run: |
          mkdir -p _site
          unzip -q park-life.zip -d _site
          test -s _site/index.html
          test -s _site/assets/approved.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
