name: Publish Park Life

on:
  push:
    branches: [main]
    paths:
      - Park-Life-GitHub-Pages.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract published game
        run: |
          test -f Park-Life-GitHub-Pages.zip
          unzip -t Park-Life-GitHub-Pages.zip
          mkdir -p _site
          unzip -q Park-Life-GitHub-Pages.zip -d _site
          test -s _site/index.html
          test -s _site/assets/approved.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
